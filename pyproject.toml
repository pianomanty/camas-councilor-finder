[project]
name = "camas-councilor-finder"
version = "0.1.0"
description = "Camas City Councilor Ward Lookup — Flask API + WordPress frontend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # API / production dependencies
    "flask>=3.1.0",
    "geopandas>=1.2.0",
    "geopy>=2.5.0",
    "pandas>=3.1.1",
    "shapely>=2.2.0",
    "usaddress>=0.5.16",
    # Notebook / exploration dependencies (not needed on Pi)
    "folium>=1.0.0",
    "ipykernel>=7.4.0",
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.9",
    "mapclassify>=2.11.0",
    "networkx>=3.7",
    "numpy>=2.5.5",
    "osmnx>=2.2.0",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
notebook = [
    "folium>=1.0.0",
    "ipykernel>=7.4.0",
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.9",
    "mapclassify>=2.11.0",
    "networkx>=3.7",
    "numpy>=2.5.5",
    "osmnx>=2.2.0",
    "scipy>=1.18.1",
]
api = [
    "flask>=3.1.0",
    "geopandas>=1.2.0",
    "geopy>=2.5.0",
    "pandas>=3.1.1",
    "shapely>=2.2.0",
    "usaddress>=0.5.16",
]
