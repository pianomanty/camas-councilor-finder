<!--
  Camas Ward Lookup — WordPress Frontend Snippet
  Paste into a WordPress Custom HTML block or page template.
  Calls the local Flask API at /ward-api/ via reverse proxy.
-->
<div id="ward-lookup-app" style="max-width: 600px; margin: 2rem auto; font-family: sans-serif;">
  <h2>Find Your Camas City Councilors</h2>
  <form id="ward-lookup-form" style="display: flex; flex-direction: column; gap: 1rem;">
    <label for="address-input" style="font-weight: bold;">Street Address:</label>
    <input
      type="text"
      id="address-input"
      name="address"
      placeholder="e.g. 123 Main St, Camas, WA"
      required
      style="padding: 0.5rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px;"
    />
    <button type="submit" id="lookup-btn" style="padding: 0.75rem; font-size: 1rem; background: #0073aa; color: #fff; border: none; border-radius: 4px; cursor: pointer;">
      Look Up My Ward
    </button>
  </form>
  <div id="ward-result" style="margin-top: 1.5rem; padding: 1rem; border: 1px solid #ddd; border-radius: 4px; display: none;">
  </div>
</div>

<script>
(function () {
  const form = document.getElementById('ward-lookup-form');
  const input = document.getElementById('address-input');
  const btn = document.getElementById('lookup-btn');
  const result = document.getElementById('ward-result');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const address = input.value.trim();
    if (!address) return;

    btn.disabled = true;
    btn.textContent = 'Looking up…';
    result.style.display = 'none';

    try {
      const resp = await fetch('/ward-api/api/lookup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ address: address }),
      });
      const data = await resp.json();

      if (!resp.ok) {
        result.innerHTML = '<p style="color: #c00;">' + escapeHtml(data.error) + '</p>';
      } else {
        const boundaryNote = data.on_boundary
          ? '<p style="color: #b8860b;">⚠ This address is near a ward boundary.</p>'
          : '';
        const wardHtml = data.wards.map(function (w) {
          return '<li><strong>' + escapeHtml(w.ward) + '</strong> — ' + escapeHtml(w.councilors) + '</li>';
        }).join('');
        result.innerHTML =
          '<p><strong>Matched address:</strong> ' + escapeHtml(data.matched_address) + '</p>' +
          boundaryNote +
          '<p><strong>Your councilors:</strong></p><ul>' + wardHtml + '</ul>' +
          '<p><strong>At-large councilor:</strong> ' + escapeHtml(data.at_large) + '</p>';
      }
      result.style.display = 'block';
    } catch (err) {
      result.innerHTML = '<p style="color: #c00;">Network error. Please try again.</p>';
      result.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Look Up My Ward';
    }
  });

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }
})();
</script>
